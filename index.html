<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheresMy Cloud</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WheresMy">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-24">

    <header class="bg-indigo-600 text-white sticky top-0 shadow-md z-10">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
                <i data-lucide="cloud-lightning" class="w-5 h-5 text-amber-300"></i> WheresMy
            </h1>
            <div class="flex items-center gap-2">
                <button id="open-owners-btn" class="text-white hover:text-indigo-200 p-1 bg-indigo-700 rounded-lg transition-colors" title="Manage Owners">
                    <i data-lucide="users" class="w-4 h-4"></i>
                </button>
                <button id="open-locations-btn" class="text-white hover:text-indigo-200 p-1 bg-indigo-700 rounded-lg transition-colors" title="Manage Locations">
                    <i data-lucide="map-pin" class="w-4 h-4"></i>
                </button>
                <div id="sync-indicator" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Connected
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        <div class="text-xs text-slate-400 mb-2 px-1">💡 Tap item to edit • Tap location badge to cycle • Tap 📍 or 👥 above to manage places/owners</div>
        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                <i data-lucide="search" class="w-5 h-5"></i>
            </span>
            <input type="text" id="search-bar" placeholder="Search everywhere..." 
                class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-lg">
        </div>

        <div id="inventory-list" class="space-y-3"></div>

        <div id="empty-state" class="hidden text-center py-12 text-slate-400">
            <i data-lucide="package-open" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
            <p class="text-lg font-medium">No items found</p>
        </div>
    </main>

    <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-4 shadow-lg z-20">
        <div class="max-w-md mx-auto">
            <button id="open-modal-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors">
                <i data-lucide="plus" class="w-5 h-5"></i> Add New Item
            </button>
        </div>
    </div>

    <div id="item-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-30">
        <div class="fixed bottom-0 inset-x-0 bg-white rounded-t-2xl p-6 max-w-md mx-auto shadow-xl">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modal-title" class="text-lg font-bold text-slate-900">Add New Item</h2>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <form id="item-form" class="space-y-4">
                <input type="hidden" id="form-item-id">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Item Name</label>
                    <input type="text" id="form-name" required class="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Location</label>
                    <select id="form-location" required class="w-full border border-slate-200 bg-white rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Specific Room / Shelf</label>
                    <input type="text" id="form-sublocation" list="sublocation-suggestions" autocomplete="off" class="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <datalist id="sublocation-suggestions"></datalist>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Owner <span class="font-normal text-slate-400">(optional)</span></label>
                    <select id="form-owner" class="w-full border border-slate-200 bg-white rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">— No owner —</option>
                    </select>
                </div>
                <p id="home-hint" class="text-xs text-slate-400 px-1"></p>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl mt-2">Save to Cloud</button>
            </form>
        </div>
    </div>

    <div id="locations-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-30">
        <div class="fixed bottom-0 inset-x-0 bg-white rounded-t-2xl p-6 max-w-md mx-auto shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">Manage Custom Locations</h2>
                <button id="close-locations-btn" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-location-input" placeholder="e.g., Garage, Storage" class="flex-1 border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="add-location-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 flex items-center gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add
                </button>
            </div>

            <div id="locations-list" class="space-y-2 overflow-y-auto flex-1 pb-4">
                </div>
        </div>
    </div>

    <div id="owners-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-30">
        <div class="fixed bottom-0 inset-x-0 bg-white rounded-t-2xl p-6 max-w-md mx-auto shadow-xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">Manage Owners</h2>
                <button id="close-owners-btn" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-owner-input" placeholder="e.g., Henry, Erin, Shared" class="flex-1 border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="add-owner-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 flex items-center gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add
                </button>
            </div>
            <div id="owners-list" class="space-y-2 overflow-y-auto flex-1 pb-4"></div>
        </div>
    </div>

    <script>
        // --- 🔑 CONFIGURATION ---
        const SUPABASE_URL = "https://quclamokiadmbockaqnn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_B4DZMPY5PQttDxu74dboyQ_3o_7uz2y";
        // -------------------------

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let items = [];
        let masterLocations = [];
        let masterOwners = [];

        const colorPalettes = [
            { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200' },
            { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200' },
            { bg: 'bg-sky-50', text: 'text-sky-700', border: 'border-sky-200' },
            { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200' }
        ];

        const inventoryList = document.getElementById('inventory-list');
        const searchBar = document.getElementById('search-bar');
        const emptyState = document.getElementById('empty-state');
        const itemModal = document.getElementById('item-modal');
        const itemForm = document.getElementById('item-form');
        const locationsModal = document.getElementById('locations-modal');
        const locationsList = document.getElementById('locations-list');
        const syncIndicator = document.getElementById('sync-indicator');

        async function fetchLocations() {
            const { data, error } = await supabaseClient
                .from('locations')
                .select('name, sort_order')
                .order('sort_order', { ascending: true });

            if (!error && data) {
                masterLocations = data.map(l => l.name);
                updateLocationDropdown();
                renderItems(searchBar.value);
            } else {
                console.error("Error fetching locations:", error);
            }
        }

        function updateLocationDropdown() {
            const select = document.getElementById('form-location');
            select.innerHTML = masterLocations.map(loc => `<option value="${loc}">${loc}</option>`).join('');
        }

        function updateSublocationSuggestions(location) {
            const datalist = document.getElementById('sublocation-suggestions');
            // Collect unique non-trivial sublocations used for this location across all items
            const suggestions = [...new Set(
                items
                    .map(item => (item.location_map || {})[location])
                    .filter(sub => sub && sub !== 'Unspecified')
            )];
            datalist.innerHTML = suggestions.map(s => `<option value="${s}">`).join('');
        }

        document.getElementById('form-location').addEventListener('change', e => {
            updateSublocationSuggestions(e.target.value);
        });

        document.getElementById('open-modal-btn').addEventListener('click', () => openItemModal());
        document.getElementById('close-modal-btn').addEventListener('click', () => itemModal.classList.add('hidden'));
        
        document.getElementById('open-locations-btn').addEventListener('click', () => openLocationsModal());
        document.getElementById('close-locations-btn').addEventListener('click', () => locationsModal.classList.add('hidden'));

        function openLocationsModal() {
            renderLocationsMenu();
            locationsModal.classList.remove('hidden');
        }

        let dragSrcIndex = null;

        function renderLocationsMenu() {
            locationsList.innerHTML = '';
            masterLocations.forEach((loc, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200 cursor-grab active:cursor-grabbing active:opacity-50 active:border-indigo-400 transition-opacity';
                row.draggable = true;
                row.dataset.index = index;
                row.innerHTML = `
                    <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 shrink-0"></i>

                    <!-- View mode -->
                    <span class="loc-view font-medium text-slate-800 flex-1">${loc}</span>
                    <button class="loc-edit-btn text-slate-400 hover:text-indigo-500 p-1 transition-colors" title="Rename">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button onclick="removeLocationCloud('${loc}')" class="loc-delete-btn text-slate-400 hover:text-red-500 p-1 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>

                    <!-- Edit mode (hidden by default) -->
                    <input class="loc-input hidden flex-1 border border-indigo-300 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="${loc}">
                    <button class="loc-save-btn hidden text-indigo-500 hover:text-indigo-700 p-1 transition-colors" title="Save">
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </button>
                    <button class="loc-cancel-btn hidden text-slate-400 hover:text-slate-600 p-1 transition-colors" title="Cancel">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                `;

                // Wire up inline edit toggle
                const viewSpan   = row.querySelector('.loc-view');
                const editBtn    = row.querySelector('.loc-edit-btn');
                const deleteBtn  = row.querySelector('.loc-delete-btn');
                const input      = row.querySelector('.loc-input');
                const saveBtn    = row.querySelector('.loc-save-btn');
                const cancelBtn  = row.querySelector('.loc-cancel-btn');

                const enterEdit = () => {
                    row.draggable = false; // disable drag while editing
                    [viewSpan, editBtn, deleteBtn].forEach(el => el.classList.add('hidden'));
                    [input, saveBtn, cancelBtn].forEach(el => el.classList.remove('hidden'));
                    input.focus();
                    input.select();
                };
                const exitEdit = () => {
                    row.draggable = true;
                    [viewSpan, editBtn, deleteBtn].forEach(el => el.classList.remove('hidden'));
                    [input, saveBtn, cancelBtn].forEach(el => el.classList.add('hidden'));
                };
                const doSave = async () => {
                    const newName = input.value.trim();
                    if (!newName || newName === loc) { exitEdit(); return; }
                    if (masterLocations.includes(newName)) {
                        alert(`"${newName}" already exists.`);
                        return;
                    }
                    exitEdit();
                    await renameLocation(loc, newName);
                };

                editBtn.addEventListener('click', enterEdit);
                cancelBtn.addEventListener('click', exitEdit);
                saveBtn.addEventListener('click', doSave);
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter')  doSave();
                    if (e.key === 'Escape') exitEdit();
                });
                row.addEventListener('dragstart', e => {
                    dragSrcIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                });
                row.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    row.classList.add('border-indigo-400');
                });
                row.addEventListener('dragleave', () => {
                    row.classList.remove('border-indigo-400');
                });
                row.addEventListener('drop', async e => {
                    e.preventDefault();
                    row.classList.remove('border-indigo-400');
                    const destIndex = parseInt(row.dataset.index);
                    if (dragSrcIndex === null || dragSrcIndex === destIndex) return;
                    // Reorder the local array
                    const moved = masterLocations.splice(dragSrcIndex, 1)[0];
                    masterLocations.splice(destIndex, 0, moved);
                    dragSrcIndex = null;
                    renderLocationsMenu();
                    updateLocationDropdown();
                    renderItems(searchBar.value);
                    await saveLocationOrder();
                });
                locationsList.appendChild(row);
            });
            lucide.createIcons();
        }

        async function saveLocationOrder() {
            setSyncing(true);
            await Promise.all(
                masterLocations.map((name, i) =>
                    supabaseClient.from('locations').update({ sort_order: i + 1 }).eq('name', name)
                )
            );
            setSyncing(false);
        }

        async function renameLocation(oldName, newName) {
            setSyncing(true);

            // 1. Rename in the locations table
            await supabaseClient.from('locations').update({ name: newName }).eq('name', oldName);

            // 2. Update items whose current location matches
            await supabaseClient.from('items').update({ location: newName }).eq('location', oldName);

            // 3. Update items whose default_location matches (legacy column)
            await supabaseClient.from('items').update({ default_location: newName }).eq('default_location', oldName);

            // 4. Update location_map keys for any item that has an entry for the old name
            const { data: affected } = await supabaseClient
                .from('items').select('id, location_map').not('location_map', 'is', null);
            await Promise.all((affected || [])
                .filter(item => oldName in (item.location_map || {}))
                .map(item => {
                    const newMap = {};
                    for (const [k, v] of Object.entries(item.location_map)) {
                        newMap[k === oldName ? newName : k] = v;
                    }
                    return supabaseClient.from('items').update({ location_map: newMap }).eq('id', item.id);
                })
            );

            await fetchLocations();
            renderLocationsMenu();
            setSyncing(false);
        }

        document.getElementById('add-location-btn').addEventListener('click', async () => {
            const input = document.getElementById('new-location-input');
            const newLoc = input.value.trim();
            if (newLoc && !masterLocations.includes(newLoc)) {
                setSyncing(true);
                const nextOrder = masterLocations.length + 1;
                await supabaseClient.from('locations').insert([{ name: newLoc, sort_order: nextOrder }]);
                input.value = '';
                await fetchLocations();
                renderLocationsMenu();
            }
        });

        window.removeLocationCloud = function(locName) {
            if (masterLocations.length <= 1) {
                alert("You need to keep at least one location options profile!");
                return;
            }
            if (confirm(`Remove "${locName}" from cloud location choices?`)) {
                setSyncing(true);
                setTimeout(async () => {
                    await supabaseClient.from('locations').delete().eq('name', locName);
                    await fetchLocations();
                    renderLocationsMenu();
                }, 100);
            }
        }

        // ── OWNERS ──────────────────────────────────────────────────────────

        async function fetchOwners() {
            const { data, error } = await supabaseClient
                .from('owners')
                .select('name, sort_order')
                .order('sort_order', { ascending: true });
            if (!error && data) {
                masterOwners = data.map(o => o.name);
                updateOwnerDropdown();
            }
        }

        function updateOwnerDropdown(selectedOwner = '') {
            const select = document.getElementById('form-owner');
            select.innerHTML = '<option value="">— No owner —</option>' +
                masterOwners.map(o => `<option value="${o}"${o === selectedOwner ? ' selected' : ''}>${o}</option>`).join('');
        }

        document.getElementById('open-owners-btn').addEventListener('click', () => {
            renderOwnersMenu();
            document.getElementById('owners-modal').classList.remove('hidden');
        });
        document.getElementById('close-owners-btn').addEventListener('click', () => {
            document.getElementById('owners-modal').classList.add('hidden');
        });

        let ownerDragSrcIndex = null;

        function renderOwnersMenu() {
            const ownersList = document.getElementById('owners-list');
            ownersList.innerHTML = '';
            masterOwners.forEach((owner, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border border-slate-200 cursor-grab active:cursor-grabbing active:opacity-50 active:border-indigo-400 transition-opacity';
                row.draggable = true;
                row.dataset.index = index;
                row.innerHTML = `
                    <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-300 shrink-0"></i>
                    <span class="owner-view font-medium text-slate-800 flex-1">${owner}</span>
                    <button class="owner-edit-btn text-slate-400 hover:text-indigo-500 p-1 transition-colors" title="Rename">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                    </button>
                    <button class="owner-delete-btn text-slate-400 hover:text-red-500 p-1 transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <input class="owner-input hidden flex-1 border border-indigo-300 rounded-lg px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" value="${owner}">
                    <button class="owner-save-btn hidden text-indigo-500 hover:text-indigo-700 p-1" title="Save">
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </button>
                    <button class="owner-cancel-btn hidden text-slate-400 hover:text-slate-600 p-1" title="Cancel">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                `;

                const viewSpan  = row.querySelector('.owner-view');
                const editBtn   = row.querySelector('.owner-edit-btn');
                const deleteBtn = row.querySelector('.owner-delete-btn');
                const input     = row.querySelector('.owner-input');
                const saveBtn   = row.querySelector('.owner-save-btn');
                const cancelBtn = row.querySelector('.owner-cancel-btn');

                const enterEdit = () => {
                    row.draggable = false;
                    [viewSpan, editBtn, deleteBtn].forEach(el => el.classList.add('hidden'));
                    [input, saveBtn, cancelBtn].forEach(el => el.classList.remove('hidden'));
                    input.focus(); input.select();
                };
                const exitEdit = () => {
                    row.draggable = true;
                    [viewSpan, editBtn, deleteBtn].forEach(el => el.classList.remove('hidden'));
                    [input, saveBtn, cancelBtn].forEach(el => el.classList.add('hidden'));
                };
                const doSave = async () => {
                    const newName = input.value.trim();
                    if (!newName || newName === owner) { exitEdit(); return; }
                    if (masterOwners.includes(newName)) { alert(`"${newName}" already exists.`); return; }
                    exitEdit();
                    await renameOwner(owner, newName);
                };

                editBtn.addEventListener('click', enterEdit);
                cancelBtn.addEventListener('click', exitEdit);
                saveBtn.addEventListener('click', doSave);
                input.addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); if (e.key === 'Escape') exitEdit(); });

                deleteBtn.addEventListener('click', () => {
                    if (confirm(`Remove "${owner}" from owners?`)) {
                        setSyncing(true);
                        supabaseClient.from('owners').delete().eq('name', owner).then(async () => {
                            await fetchOwners();
                            renderOwnersMenu();
                        });
                    }
                });

                row.addEventListener('dragstart', e => { ownerDragSrcIndex = index; e.dataTransfer.effectAllowed = 'move'; });
                row.addEventListener('dragover',  e => { e.preventDefault(); row.classList.add('border-indigo-400'); });
                row.addEventListener('dragleave', () => row.classList.remove('border-indigo-400'));
                row.addEventListener('drop', async e => {
                    e.preventDefault();
                    row.classList.remove('border-indigo-400');
                    const dest = parseInt(row.dataset.index);
                    if (ownerDragSrcIndex === null || ownerDragSrcIndex === dest) return;
                    const moved = masterOwners.splice(ownerDragSrcIndex, 1)[0];
                    masterOwners.splice(dest, 0, moved);
                    ownerDragSrcIndex = null;
                    renderOwnersMenu();
                    updateOwnerDropdown();
                    await saveOwnerOrder();
                });

                ownersList.appendChild(row);
            });
            lucide.createIcons();
        }

        async function saveOwnerOrder() {
            setSyncing(true);
            await Promise.all(masterOwners.map((name, i) =>
                supabaseClient.from('owners').update({ sort_order: i + 1 }).eq('name', name)
            ));
            setSyncing(false);
        }

        async function renameOwner(oldName, newName) {
            setSyncing(true);
            await supabaseClient.from('owners').update({ name: newName }).eq('name', oldName);
            await supabaseClient.from('items').update({ owner: newName }).eq('owner', oldName);
            await fetchOwners();
            renderOwnersMenu();
            await fetchItems();
            setSyncing(false);
        }

        document.getElementById('add-owner-btn').addEventListener('click', async () => {
            const input = document.getElementById('new-owner-input');
            const newOwner = input.value.trim();
            if (newOwner && !masterOwners.includes(newOwner)) {
                setSyncing(true);
                await supabaseClient.from('owners').insert([{ name: newOwner, sort_order: masterOwners.length + 1 }]);
                input.value = '';
                await fetchOwners();
                renderOwnersMenu();
            }
        });

        // ── END OWNERS ───────────────────────────────────────────────────────

        async function fetchItems() {
            setSyncing(true);
            const { data, error } = await supabaseClient
                .from('items')
                .select('*')
                .order('created_at', { ascending: false });

            if (!error) {
                items = data || [];
                renderItems(searchBar.value);
            } else {
                console.error("Error fetching inventory items:", error);
            }
            setSyncing(false);
        }

        // UPGRADED: Cycles location AND safely wipes out obsolete sublocations!
        window.cycleLocation = async function(id, currentUrlLocation, e) {
            e.stopPropagation(); 
            
            if (masterLocations.length <= 1) {
                alert("Add more options in the 📍 location menu to cycle places!");
                return;
            }

            let currentIndex = masterLocations.indexOf(currentUrlLocation);
            if (currentIndex === -1) currentIndex = 0;
            
            let nextIndex = (currentIndex + 1) % masterLocations.length;
            const nextLocation = masterLocations[nextIndex];

            setSyncing(true);
            const item = items.find(i => i.id === id);

            // Restore the remembered sublocation for this location, or default to Unspecified
            const locationMap = item?.location_map || {};
            const clearedSublocation = locationMap[nextLocation] || 'Unspecified';
            if (item) {
                item.location = nextLocation;
                item.sublocation = clearedSublocation; // Clear local state immediately
            }
            renderItems(searchBar.value);

            // Sync the location hop AND the cleared room status to Supabase at the same time
            const { error } = await supabaseClient
                .from('items')
                .update({ 
                    location: nextLocation,
                    sublocation: clearedSublocation 
                })
                .eq('id', id);

            if (error) {
                console.error("Failed to sync cycled location:", error);
                await fetchItems(); 
            } else {
                setSyncing(false);
            }
        }

        itemForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setSyncing(true);
            const id = document.getElementById('form-item-id').value;
            const location = document.getElementById('form-location').value;
            const sublocation = document.getElementById('form-sublocation').value || 'Unspecified';

            // Build the updated location map: keep existing entries, add/overwrite this location
            const existingItem = id ? items.find(i => i.id == id) : null;
            const locationMap = { ...(existingItem?.location_map || {}) };
            locationMap[location] = sublocation;

            const owner = document.getElementById('form-owner').value || null;

            const itemData = {
                name: document.getElementById('form-name').value,
                location,
                sublocation,
                location_map: locationMap,
                owner
            };

            if (id) {
                await supabaseClient.from('items').update(itemData).eq('id', id);
            } else {
                await supabaseClient.from('items').insert([itemData]);
            }

            itemForm.reset();
            itemModal.classList.add('hidden');
            await fetchItems();
        });

        window.deleteItem = async function(id, e) {
            e.stopPropagation(); 
            if(confirm("Delete this item permanently from cloud?")) {
                setSyncing(true);
                await supabaseClient.from('items').delete().eq('id', id);
                await fetchItems();
            }
        }

        window.openItemModal = function(id = null) {
            const homeHint = document.getElementById('home-hint');

            if (id) {
                const item = items.find(i => i.id == id);
                if(item) {
                    document.getElementById('modal-title').textContent = "Edit Item";
                    document.getElementById('form-item-id').value = item.id;
                    document.getElementById('form-name').value = item.name;
                    document.getElementById('form-location').value = item.location;
                    document.getElementById('form-sublocation').value = item.sublocation === 'Unspecified' ? '' : item.sublocation;
                    updateSublocationSuggestions(item.location);
                    updateOwnerDropdown(item.owner || '');

                    const map = item.location_map || {};
                    const known = Object.entries(map)
                        .filter(([, sub]) => sub && sub !== 'Unspecified')
                        .map(([loc, sub]) => `${loc} → ${sub}`)
                        .join(' · ');
                    homeHint.textContent = known
                        ? `🏠 Remembered: ${known}`
                        : '💡 The room you enter will be remembered for each location.';
                }
            } else {
                document.getElementById('modal-title').textContent = "Add New Item";
                itemForm.reset();
                document.getElementById('form-item-id').value = '';
                homeHint.textContent = '💡 The room you enter will be remembered for each location.';
                if(masterLocations.length > 0) {
                    document.getElementById('form-location').value = masterLocations[0];
                    updateSublocationSuggestions(masterLocations[0]);
                }
            }
            itemModal.classList.remove('hidden');
        }

        function setSyncing(isSyncing) {
            if (isSyncing) {
                syncIndicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Syncing...`;
            } else {
                syncIndicator.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Cloud`;
            }
        }

        function renderItems(filterText = '') {
            inventoryList.innerHTML = '';
            const filteredItems = items.filter(item => 
                (item.name || '').toLowerCase().includes(filterText.toLowerCase()) ||
                (item.sublocation || '').toLowerCase().includes(filterText.toLowerCase()) ||
                (item.location || '').toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredItems.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredItems.forEach(item => {
                const itemEl = document.createElement('div');
                itemEl.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center gap-4 cursor-pointer hover:border-indigo-200 transition-colors';
                itemEl.onclick = () => openItemModal(item.id);

                let locIndex = masterLocations.indexOf(item.location);
                if (locIndex === -1) locIndex = 0;
                const palette = colorPalettes[locIndex % colorPalettes.length];

                const ownerPalettes = [
                    { bg: 'bg-pink-50',   text: 'text-pink-700',   border: 'border-pink-200' },
                    { bg: 'bg-cyan-50',   text: 'text-cyan-700',   border: 'border-cyan-200' },
                    { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200' },
                    { bg: 'bg-violet-50', text: 'text-violet-700', border: 'border-violet-200' },
                ];
                const ownerIdx = item.owner ? masterOwners.indexOf(item.owner) : -1;
                const ownerPalette = ownerPalettes[Math.max(ownerIdx, 0) % ownerPalettes.length];
                const ownerBadge = item.owner
                    ? `<span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${ownerPalette.bg} ${ownerPalette.text} ${ownerPalette.border} flex items-center gap-1">
                           <i data-lucide="user" class="w-3 h-3"></i>${item.owner}
                       </span>`
                    : '';

                itemEl.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-slate-900 truncate">${item.name}</h3>
                        <p class="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                            <i data-lucide="layers" class="w-3 h-3"></i> ${item.sublocation}
                        </p>
                    </div>
                    <div class="flex items-center gap-2">
                        ${ownerBadge}
                        <span onclick="cycleLocation(${item.id}, '${item.location}', event)" class="px-3 py-1.5 rounded-lg text-xs font-bold border ${palette.bg} ${palette.text} ${palette.border} transition-transform active:scale-95 cursor-pointer select-none" title="Tap to cycle location">
                            ${item.location}
                        </span>
                        <button onclick="deleteItem(${item.id}, event)" class="text-slate-300 hover:text-red-500 p-1 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                inventoryList.appendChild(itemEl);
            });
            lucide.createIcons();
        }

        searchBar.addEventListener('input', (e) => renderItems(e.target.value));

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await Promise.all([fetchLocations(), fetchOwners()]);
            await fetchItems();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
